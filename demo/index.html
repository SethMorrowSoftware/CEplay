<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0d14">
    <meta name="description" content="Castle Fun Center — Pause Group Automation UI Demo">
    <title>Castle Fun Center — UI Demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b8def' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 21V9l3 2V7l3 2V6l3 2V5l3 2V8l3-1v4l3-2v12'/%3E%3Cpath d='M3 21h18M10 21v-5h4v5'/%3E%3C/svg%3E">
    <meta name="csrf-token" content="demo">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/demo.css">
</head>
<body class="demo-mode">
    <div class="demo-banner" id="demo-banner" role="region" aria-label="Demo notice">
        <span class="demo-banner-pill">Live demo</span>
        <span class="demo-banner-text">
            <strong>Castle Fun Center</strong> &mdash; pause-group automation UI preview.
            All data is mocked in memory; reload to reset.
        </span>
        <span class="demo-banner-actions">
            <span class="demo-role-switch" role="group" aria-label="Switch demo role">
                <span class="demo-role-switch-label">View as</span>
                <button type="button" class="demo-role-btn" data-role="admin"   title="Full access — every feature">Admin</button>
                <button type="button" class="demo-role-btn" data-role="manager" title="Full access except Settings">Manager</button>
                <button type="button" class="demo-role-btn" data-role="tech"    title="Full access except sales data">Tech</button>
            </span>
            <button type="button" class="demo-banner-btn" id="demo-jump-login" title="Open the login screen">Login screen</button>
            <button type="button" class="demo-banner-btn" id="demo-reset" title="Rebuild demo data and reload">Reset demo</button>
            <button type="button" class="demo-banner-btn demo-banner-close" id="demo-banner-close" title="Hide banner" aria-label="Hide demo banner">×</button>
        </span>
    </div>

    <div id="app">
        <div class="loading-overlay" id="app-loading">
            <div class="spinner"></div>
            <span>Loading demo…</span>
        </div>
    </div>

    <noscript>
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#e1e4ed;background:#0b0e14;text-align:center;padding:2rem;">
            <div>
                <h1 style="font-size:1.5rem;margin-bottom:1rem;">JavaScript Required</h1>
                <p>This UI demo needs JavaScript. Open it in a modern browser.</p>
            </div>
        </div>
    </noscript>

    <script>
        // App config — normally injected by index.php from session state.
        // For the demo we pre-authenticate so visitors land on the dashboard,
        // but the login screen is still reachable via the banner button.
        //
        // The role can be overridden via either:
        //   - localStorage.demoRole       (persists across reloads)
        //   - URL hash query e.g. ?role=tech  (one-shot, links / docs)
        // Defaults to 'admin' for the full-fat experience.
        (function() {
            var allowed = ['admin', 'manager', 'tech'];
            var role = null;
            try {
                var stored = localStorage.getItem('demoRole');
                if (stored && allowed.indexOf(stored) !== -1) role = stored;
            } catch (e) { /* private mode etc. */ }
            try {
                var match = (window.location.search || '').match(/[?&]role=([^&]+)/);
                if (match && allowed.indexOf(match[1]) !== -1) {
                    role = match[1];
                    localStorage.setItem('demoRole', role);
                }
            } catch (e) {}
            if (!role) role = 'admin';

            var profiles = {
                admin:   { id: 1, username: 'admin',  display_name: 'Owner Avery',    role_name: 'Administrator' },
                manager: { id: 2, username: 'morgan', display_name: 'Manager Morgan', role_name: 'Manager' },
                tech:    { id: 3, username: 'casey',  display_name: 'Tech Casey',     role_name: 'Technician' }
            };
            // Resolved permission sets — mirror the seeded system roles in
            // lib/db.php. The real backend injects these from the roles table.
            var rolePermissions = {
                admin:   ['analytics','view_revenue','cards','manual_control','overrides_manage','groups_manage','schedules_manage','settings','users'],
                manager: ['analytics','view_revenue','cards','manual_control','overrides_manage','groups_manage','schedules_manage'],
                tech:    ['analytics','manual_control','overrides_manage','settings','users']
            };
            var profile = profiles[role];
            window.APP_CONFIG = {
                basePath: '',
                csrfToken: 'demo',
                user: {
                    id: profile.id,
                    username: profile.username,
                    display_name: profile.display_name,
                    role: role,
                    role_name: profile.role_name,
                    permissions: rolePermissions[role] || []
                },
                timezone: 'America/New_York'
            };
        })();
    </script>

    <!-- Mock API + data — must load BEFORE app.js so window.API exists -->
    <script defer src="js/mock-data.js"></script>
    <script defer src="js/mock-api.js"></script>

    <!-- Real UI modules — copied verbatim from public/js -->
    <script defer src="js/app.js"></script>
    <script defer src="js/login.js"></script>
    <script defer src="js/dashboard.js"></script>
    <script defer src="js/games.js"></script>
    <script defer src="js/cards.js"></script>
    <script defer src="js/groups.js"></script>
    <script defer src="js/kiosks.js"></script>
    <script defer src="js/schedules.js"></script>
    <script defer src="js/overrides.js"></script>
    <script defer src="js/logs.js"></script>
    <script defer src="js/settings.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    <script defer src="js/analytics.js"></script>
    <script defer src="js/performance.js"></script>

    <script defer src="js/demo-controls.js"></script>
</body>
</html>
