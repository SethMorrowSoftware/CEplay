<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEplay Remote</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="conn-dot" data-state="unknown"></span>
      <span class="brand-text">CEplay Remote</span>
    </div>
    <nav class="viewnav" id="viewnav" aria-label="Views">
      <button class="viewnav-btn active" id="nav-controls" type="button" data-view="controls">Controls</button>
      <button class="viewnav-btn" id="nav-status" type="button" data-view="status">Status</button>
    </nav>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <main id="main-view">
    <!-- Controls view: one card per configured pause group -->
    <section class="view" id="view-controls">
      <div class="hero">
        <img class="hero-logo" id="brand-logo" src="logo.png" alt="CEplay" />
      </div>
      <div class="groups" id="groups"></div>
    </section>

    <!-- Status view: live per-asset status + individual pause/unpause/OOS -->
    <section class="view hidden" id="view-status">
      <div class="status-head">
        <span class="status-title">Live status</span>
        <span class="status-synced" id="status-synced"></span>
        <button id="status-refresh" class="btn-secondary btn-sm" type="button">Refresh</button>
      </div>

      <div class="group-monitor" id="group-monitor"></div>

      <div class="asset-toolbar">
        <input type="text" id="asset-search" class="asset-search" placeholder="Search games &amp; kiosks…" autocomplete="off" />
        <div class="filter-pills" id="asset-type-filters" role="group" aria-label="Filter by type"></div>
        <div class="filter-pills" id="asset-status-filters" role="group" aria-label="Filter by status"></div>
      </div>

      <div class="asset-list" id="asset-list"></div>
    </section>

    <section class="status" id="status" aria-live="polite">
      <p class="status-line" id="status-line">Checking connection…</p>
    </section>
  </main>

  <!-- Settings panel -->
  <div class="overlay hidden" id="settings-overlay">
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>

      <label for="cfg-url">CEplay server URL</label>
      <input type="url" id="cfg-url" placeholder="https://ceplay.local" autocomplete="off" />

      <label for="cfg-user">Username</label>
      <input type="text" id="cfg-user" placeholder="frontdesk" autocomplete="off" />

      <label for="cfg-pass">Password</label>
      <input type="password" id="cfg-pass" placeholder="(unchanged)" autocomplete="off" />

      <label>Pause-group buttons</label>
      <p class="hint hint-tight">Each group you add gets an Unpause and a Pause button on the Controls screen.</p>
      <div class="group-list" id="group-list"></div>
      <div class="group-add">
        <select id="group-add-select"></select>
        <button id="group-add-btn" class="btn-secondary" type="button">Add</button>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="cfg-insecure" />
        Allow self-signed TLS certificate (LAN only)
      </label>

      <p class="hint" id="enc-hint"></p>

      <div class="panel-actions">
        <button id="cfg-test" class="btn-secondary">Test connection</button>
        <span class="spacer"></span>
        <button id="cfg-cancel" class="btn-secondary">Close</button>
        <button id="cfg-save" class="btn-primary">Save</button>
      </div>

      <p class="panel-msg" id="cfg-msg"></p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
