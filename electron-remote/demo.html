<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CEplay Remote — single-file UI/UX demo.

    A browser-runnable showcase of the Electron "CEplay Remote" app
    (electron-remote/renderer/*). It uses the app's real markup, real styles,
    and real renderer logic verbatim. The only difference: the Electron IPC
    bridge (window.ceplay) is replaced with an in-memory mock that simulates a
    venue's CEplay pause groups — so the four buttons, the confirmation dialog,
    the connection dot, the status messages, and the Settings panel (including
    the group pickers) all work with NO server and NO backend.

    Just open this file in any browser. Nothing leaves your machine.

    (The strict Content-Security-Policy from the real app's index.html is
    intentionally omitted here so the inlined CSS and JS can run from a
    standalone file. The packaged app keeps its CSP.)
  -->
  <title>CEplay Remote — UI Demo</title>
  <style>
/* ====================================================================== */
/* === electron-remote/renderer/styles.css (verbatim) =================== */
/* ====================================================================== */
:root {
  --bg: #0b0e14;
  --panel: #151a24;
  --panel-2: #1d2330;
  --text: #e1e4ed;
  --muted: #8b93a7;
  --border: #2a3142;
  --kiosks: #5b8def;
  --kiosks-hi: #6fa0ff;
  --unpause: #2bb673;
  --unpause-hi: #34d68b;
  --pause: #d9783a;
  --pause-hi: #e88c4d;
  --warn: #e0a32e;
  --error: #e5484d;
  --ok: #2bb673;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  user-select: none;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Top bar ---------------------------------------------------------------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.brand-text { font-size: 15px; letter-spacing: 0.2px; }

.dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--muted); flex: 0 0 auto;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
}
.dot[data-state="ok"]      { background: var(--ok); }
.dot[data-state="error"]   { background: var(--error); }
.dot[data-state="working"] { background: var(--warn); }
.dot[data-state="unknown"] { background: var(--muted); }

.icon-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; width: 38px; height: 38px; font-size: 18px; cursor: pointer;
}
.icon-btn:hover { background: var(--panel-2); }

/* Main ------------------------------------------------------------------- */
#main-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 22px;
  gap: 20px;
}

/* Hero logo above the action buttons ------------------------------------- */
.hero { display: flex; align-items: center; justify-content: center; padding: 6px 0 2px; }
.hero-logo { max-height: 104px; max-width: 78%; height: auto; width: auto; object-fit: contain; }
.hero-logo--hidden { display: none; }
@media (max-height: 580px) { .hero-logo { max-height: 60px; } }

.buttons {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: 1fr;
  gap: 16px;
  min-height: 300px;
}

.big-btn {
  border: none; border-radius: 16px; cursor: pointer; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; padding: 16px; text-align: center;
  transition: transform 0.06s ease, filter 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}
.big-btn:active { transform: translateY(2px); }
.big-btn:disabled { filter: grayscale(0.5) brightness(0.7); cursor: default; }

.big-btn-verb { font-size: 28px; font-weight: 800; line-height: 1.05; }
.big-btn-title { font-size: 17px; font-weight: 600; line-height: 1.15; opacity: 0.95; }
.big-btn-sub { font-size: 13px; font-weight: 600; opacity: 0.9; min-height: 18px; margin-top: 6px; }

.big-btn.unpause { background: linear-gradient(160deg, var(--unpause-hi), var(--unpause)); }
.big-btn.pause   { background: linear-gradient(160deg, var(--pause-hi), var(--pause)); }

/* Confirmation dialog (reuses .overlay / .panel) ------------------------- */
.confirm-message { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text); }
.btn-primary.confirm-go.unpause { background: var(--unpause); border-color: var(--unpause); }
.btn-primary.confirm-go.unpause:hover { background: var(--unpause-hi); }
.btn-primary.confirm-go.pause   { background: var(--pause); border-color: var(--pause); }
.btn-primary.confirm-go.pause:hover   { background: var(--pause-hi); }

/* Status ----------------------------------------------------------------- */
.status {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  min-height: 64px;
}
.status-line { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text); }
.status-line .muted { color: var(--muted); }
.status-line.ok    { color: var(--ok); }
.status-line.warn  { color: var(--warn); }
.status-line.error { color: var(--error); }
.status-detail { margin: 8px 0 0; font-size: 13px; color: var(--muted); white-space: pre-line; }

/* Settings overlay ------------------------------------------------------- */
.overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.overlay.hidden { display: none; }

.panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 22px; width: 100%; max-width: 420px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.panel h2 { margin: 0 0 16px; font-size: 18px; }
.panel label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
.panel label.checkbox {
  display: flex; align-items: center; gap: 8px; color: var(--text); margin-top: 16px;
}
.panel input[type="url"], .panel input[type="text"], .panel input[type="password"], .panel select {
  width: 100%; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font-size: 14px;
}
.panel input:focus, .panel select:focus { outline: 2px solid var(--kiosks); border-color: var(--kiosks); }

.hint { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

.panel-actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
.panel-actions .spacer { flex: 1; }

.btn-primary, .btn-secondary {
  border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border);
}
.btn-primary { background: var(--kiosks); color: #fff; border-color: var(--kiosks); }
.btn-primary:hover { background: var(--kiosks-hi); }
.btn-secondary { background: var(--panel-2); color: var(--text); }
.btn-secondary:hover { background: #262d3c; }

.panel-msg { font-size: 13px; margin: 14px 0 0; min-height: 18px; }
.panel-msg.ok    { color: var(--ok); }
.panel-msg.error { color: var(--error); }

/* ====================================================================== */
/* === Demo harness (browser only — NOT part of the Electron app) ======= */
/* ====================================================================== */
html {
  min-height: 100%;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(91, 141, 239, 0.14), transparent 60%),
    radial-gradient(900px 500px at 90% 110%, rgba(43, 182, 115, 0.08), transparent 60%),
    #07090f;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
}
/* Frame the app like the real 780x680 desktop window. */
body {
  width: 780px;
  max-width: 100%;
  height: min(680px, calc(100vh - 56px));
  min-height: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
}
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.demo-chip {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.4px;
  color: var(--warn);
  border: 1px solid var(--warn);
  border-radius: 999px;
  padding: 2px 8px;
  margin-left: 2px;
  text-transform: uppercase;
  opacity: 0.9;
}
.demo-note {
  text-align: center;
  font-size: 12px;
  line-height: 1.45;
  color: var(--muted);
  margin: 0;
}
@media (max-width: 540px) {
  html { padding: 0; }
  body { border: none; border-radius: 0; height: 100vh; max-width: 100%; }
}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="conn-dot" data-state="unknown"></span>
      <span class="brand-text">CEplay Remote</span>
      <span class="demo-chip">Demo</span>
    </div>
    <div class="topbar-actions">
      <button id="demo-reset-btn" class="icon-btn" title="Reset demo state" aria-label="Reset demo state">&#8635;</button>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
    </div>
  </header>

  <main id="main-view">
    <div class="hero">
      <img class="hero-logo" id="brand-logo" src="renderer/logo.png" alt="CEplay" />
    </div>

    <div class="buttons">
      <button class="big-btn unpause" id="btn-games-unpause" disabled>
        <span class="big-btn-verb">Unpause</span>
        <span class="big-btn-title">Arcade games</span>
        <span class="big-btn-sub" id="games-unpause-sub">Tap to start</span>
      </button>

      <button class="big-btn unpause" id="btn-kiosks-unpause" disabled>
        <span class="big-btn-verb">Unpause</span>
        <span class="big-btn-title">Arcade kiosks</span>
        <span class="big-btn-sub" id="kiosks-unpause-sub">Tap to start</span>
      </button>

      <button class="big-btn pause" id="btn-games-pause" disabled>
        <span class="big-btn-verb">Pause</span>
        <span class="big-btn-title">Arcade games</span>
        <span class="big-btn-sub" id="games-pause-sub">Tap to start</span>
      </button>

      <button class="big-btn pause" id="btn-kiosks-pause" disabled>
        <span class="big-btn-verb">Pause</span>
        <span class="big-btn-title">Arcade kiosks</span>
        <span class="big-btn-sub" id="kiosks-pause-sub">Tap to start</span>
      </button>
    </div>

    <section class="status" id="status" aria-live="polite">
      <p class="status-line" id="status-line">Checking connection&hellip;</p>
    </section>

    <p class="demo-note">
      Simulated demo &mdash; no CEplay server is contacted. The four buttons pause/unpause
      two pause groups you pick in Settings (&#9881;); tapping one opens a confirmation
      dialog. Use &#8635; to reset the demo.
    </p>
  </main>

  <!-- Settings panel -->
  <div class="overlay hidden" id="settings-overlay">
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>

      <label for="cfg-url">CEplay server URL</label>
      <input type="url" id="cfg-url" placeholder="https://ceplay.local" autocomplete="off" />

      <label for="cfg-user">Username</label>
      <input type="text" id="cfg-user" placeholder="frontdesk" autocomplete="off" />

      <label for="cfg-pass">Password</label>
      <input type="password" id="cfg-pass" placeholder="(unchanged)" autocomplete="off" />

      <label for="cfg-games-group">Arcade games group</label>
      <select id="cfg-games-group"></select>

      <label for="cfg-kiosks-group">Kiosks group</label>
      <select id="cfg-kiosks-group"></select>

      <label class="checkbox">
        <input type="checkbox" id="cfg-insecure" />
        Allow self-signed TLS certificate (LAN only)
      </label>

      <p class="hint" id="enc-hint"></p>

      <div class="panel-actions">
        <button id="cfg-test" class="btn-secondary">Test connection</button>
        <span class="spacer"></span>
        <button id="cfg-cancel" class="btn-secondary">Close</button>
        <button id="cfg-save" class="btn-primary">Save</button>
      </div>

      <p class="panel-msg" id="cfg-msg"></p>
    </div>
  </div>

  <!-- ================================================================== -->
  <!-- Mock IPC bridge: stands in for the Electron preload `window.ceplay` -->
  <!-- (electron-remote/preload.js). Keeps an in-memory set of CEplay pause -->
  <!-- groups so the four buttons + group pickers return realistic results. -->
  <!-- ================================================================== -->
  <script>
    window.ceplay = (function () {
      'use strict';

      var ERRORS = ['unit in use', 'active play in progress', 'reader busy', 'timed out'];

      function statusList(counts) {
        var list = [];
        function push(status, count) { for (var i = 0; i < (count || 0); i++) list.push(status); }
        push('paused', counts.paused);
        push('enabled', counts.enabled);
        push('outOfService', counts.outOfService);
        push('unknown', counts.unknown);
        return list;
      }

      // The demo's pause groups. Each has a member-status distribution that the
      // pause/unpause actions flip. Opening-time scenario: mostly paused.
      var GROUP_DEFS = [
        { id: 1, name: 'Arcade Games',         is_active: 1, dist: { paused: 20, enabled: 3, outOfService: 1 } },
        { id: 2, name: 'Arcade Kiosks',        is_active: 1, dist: { paused: 4,  enabled: 0, unknown: 1 } },
        { id: 3, name: 'Redemption Center',    is_active: 1, dist: { paused: 6,  enabled: 2 } },
        { id: 4, name: 'Laser Tag (seasonal)', is_active: 0, dist: { paused: 3 } }
      ];

      function freshGroups() {
        return GROUP_DEFS.map(function (g) {
          return { id: g.id, name: g.name, is_active: g.is_active, members: statusList(g.dist) };
        });
      }

      var config = {
        baseUrl: 'https://ceplay.demo.local',
        username: 'frontdesk',
        hasPassword: true,
        insecureTLS: false,
        encryptionAvailable: true,
        // Pre-selected so the buttons work out of the box in the demo.
        gamesGroupId: 1,
        gamesGroupName: 'Arcade Games',
        kiosksGroupId: 2,
        kiosksGroupName: 'Arcade Kiosks'
      };
      var groups = freshGroups();

      function findGroup(id) {
        for (var i = 0; i < groups.length; i++) {
          if (String(groups[i].id) === String(id)) return groups[i];
        }
        return null;
      }

      function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      // Mirrors the server's group pause/unpause: flip eligible members to the
      // target state, skip outOfService + unknown, and queue a few "busy" ones
      // as errors (the real server retries them via its watchdog).
      function applyGroupAction(group, action) {
        var target = action === 'pause' ? 'paused' : 'enabled';
        var from = action === 'pause' ? 'enabled' : 'paused';
        var changed = 0, skipped = 0, errors = 0;
        var details = { changed: [], skipped: [], errors: [] };
        group.members.forEach(function (m, idx) {
          if (m === 'outOfService' || m === 'unknown') { skipped++; details.skipped.push(group.name + ' #' + (idx + 1)); return; }
          if (m === target) return; // already in the target state
          if (m === from) {
            if (Math.random() < 0.1) {
              errors++;
              details.errors.push({ id: group.name + ' #' + (idx + 1), error: ERRORS[Math.floor(Math.random() * ERRORS.length)] });
            } else {
              group.members[idx] = target;
              changed++;
              details.changed.push(group.name + ' #' + (idx + 1));
            }
          }
        });
        return {
          success: errors === 0,
          action: action,
          group_id: group.id,
          group_name: group.name,
          changed: changed,
          skipped: skipped,
          errors: errors,
          details: details
        };
      }

      function groupActionBySlot(slot, action) {
        var id = slot === 'games' ? config.gamesGroupId : config.kiosksGroupId;
        if (!id) {
          return Promise.resolve({ ok: false, error: 'No pause group selected for this button. Open Settings (⚙) and choose one.' });
        }
        var g = findGroup(id);
        if (!g) {
          return Promise.resolve({ ok: false, error: 'Selected group no longer exists.' });
        }
        return delay(slot === 'kiosks' ? 750 : 950).then(function () {
          var summary = applyGroupAction(g, action);
          return { ok: summary.success !== false, summary: summary };
        });
      }

      return {
        getConfig: function () { return Promise.resolve(Object.assign({}, config)); },
        setConfig: function (cfg) {
          if (!cfg) return Promise.resolve({ ok: true });
          if (cfg.baseUrl !== undefined) config.baseUrl = cfg.baseUrl;
          if (cfg.username !== undefined) config.username = cfg.username;
          if (cfg.password) config.hasPassword = true;
          if (cfg.insecureTLS !== undefined) config.insecureTLS = cfg.insecureTLS;
          if (cfg.gamesGroupId !== undefined) config.gamesGroupId = (cfg.gamesGroupId === '' || cfg.gamesGroupId == null) ? null : parseInt(cfg.gamesGroupId, 10);
          if (cfg.gamesGroupName !== undefined) config.gamesGroupName = cfg.gamesGroupName || '';
          if (cfg.kiosksGroupId !== undefined) config.kiosksGroupId = (cfg.kiosksGroupId === '' || cfg.kiosksGroupId == null) ? null : parseInt(cfg.kiosksGroupId, 10);
          if (cfg.kiosksGroupName !== undefined) config.kiosksGroupName = cfg.kiosksGroupName || '';
          return Promise.resolve({ ok: true });
        },
        test: function () {
          return delay(650).then(function () {
            if (config.baseUrl && config.username && config.hasPassword) {
              return { ok: true, user: { display_name: 'Front Desk (Demo)', username: config.username } };
            }
            return { ok: false, error: 'Missing server URL or credentials.' };
          });
        },
        getGroups: function () {
          return delay(300).then(function () {
            return { ok: true, groups: groups.map(function (g) { return { id: g.id, name: g.name, is_active: g.is_active }; }) };
          });
        },
        unpauseGames: function () { return groupActionBySlot('games', 'unpause'); },
        pauseGames: function () { return groupActionBySlot('games', 'pause'); },
        unpauseKiosks: function () { return groupActionBySlot('kiosks', 'unpause'); },
        pauseKiosks: function () { return groupActionBySlot('kiosks', 'pause'); },

        // Demo-only helper used by the reset button.
        __reset: function () { groups = freshGroups(); }
      };
    })();
  </script>

  <!-- ================================================================== -->
  <!-- electron-remote/renderer/renderer.js (verbatim), plus a small       -->
  <!-- demo-only reset hook appended at the very end.                      -->
  <!-- ================================================================== -->
  <script>
'use strict';

/* global window, document */

const api = window.ceplay;

const el = {
  connDot: document.getElementById('conn-dot'),
  statusLine: document.getElementById('status-line'),
  status: document.getElementById('status'),
  settingsBtn: document.getElementById('settings-btn'),
  overlay: document.getElementById('settings-overlay'),
  cfgUrl: document.getElementById('cfg-url'),
  cfgUser: document.getElementById('cfg-user'),
  cfgPass: document.getElementById('cfg-pass'),
  cfgInsecure: document.getElementById('cfg-insecure'),
  cfgGamesGroup: document.getElementById('cfg-games-group'),
  cfgKiosksGroup: document.getElementById('cfg-kiosks-group'),
  cfgSave: document.getElementById('cfg-save'),
  cfgCancel: document.getElementById('cfg-cancel'),
  cfgTest: document.getElementById('cfg-test'),
  cfgMsg: document.getElementById('cfg-msg'),
  encHint: document.getElementById('enc-hint'),
};

let busy = false;        // an action is in flight
let configured = false;  // server URL + login are set
let ready = false;       // connection test passed
let currentCfg = {};     // last config read from the main process

// --------------------------------------------------------------------------
// Status helpers
// --------------------------------------------------------------------------

function setConn(state) {
  el.connDot.dataset.state = state; // ok | error | working | unknown
}

function setStatus(text, cls, detail) {
  el.statusLine.className = 'status-line' + (cls ? ' ' + cls : '');
  el.statusLine.textContent = text;
  const existing = document.getElementById('status-detail');
  if (existing) existing.remove();
  if (detail) {
    const p = document.createElement('p');
    p.id = 'status-detail';
    p.className = 'status-detail';
    p.textContent = detail;
    el.status.appendChild(p);
  }
}

// --------------------------------------------------------------------------
// Buttons — each maps to one configurable pause group + an action.
//   "games"  slot  -> the group chosen as "Arcade games group" in Settings
//   "kiosks" slot  -> the group chosen as "Kiosks group" in Settings
// Both pause and unpause for a slot target the same group, so the 2x2 grid is
// Unpause/Pause for each of the two groups.
// --------------------------------------------------------------------------

const controls = [
  { btn: document.getElementById('btn-games-unpause'),  sub: document.getElementById('games-unpause-sub'),  slot: 'games',  action: 'unpause', run: () => api.unpauseGames() },
  { btn: document.getElementById('btn-kiosks-unpause'), sub: document.getElementById('kiosks-unpause-sub'), slot: 'kiosks', action: 'unpause', run: () => api.unpauseKiosks() },
  { btn: document.getElementById('btn-games-pause'),    sub: document.getElementById('games-pause-sub'),    slot: 'games',  action: 'pause',   run: () => api.pauseGames() },
  { btn: document.getElementById('btn-kiosks-pause'),   sub: document.getElementById('kiosks-pause-sub'),   slot: 'kiosks', action: 'pause',   run: () => api.pauseKiosks() },
];
for (const c of controls) c.title = c.btn.querySelector('.big-btn-title');

function slotGroupId(slot) {
  return slot === 'games' ? currentCfg.gamesGroupId : currentCfg.kiosksGroupId;
}
function slotGroupName(slot) {
  return (slot === 'games' ? currentCfg.gamesGroupName : currentCfg.kiosksGroupName) || '';
}

// A button is live only when we're connected, not mid-action, and its slot has
// a pause group selected.
function updateButtonsEnabled() {
  for (const c of controls) {
    c.btn.disabled = !(ready && !busy && !!slotGroupId(c.slot));
  }
}

// Reflect the configured group names on the button faces + idle sub-labels.
function applyConfigToButtons() {
  for (const c of controls) {
    const id = slotGroupId(c.slot);
    if (c.title) c.title.textContent = id ? (slotGroupName(c.slot) || ('Group #' + id)) : 'No group selected';
    if (!busy) c.sub.textContent = id ? 'Tap to start' : 'Pick a group in Settings';
  }
  updateButtonsEnabled();
}

// --------------------------------------------------------------------------
// Connection check
// --------------------------------------------------------------------------

async function refreshConnection() {
  // Never run a connection check on top of an in-flight action — its async
  // result would re-enable buttons and overwrite the operation's status line.
  if (busy) return;
  currentCfg = await api.getConfig();
  configured = !!(currentCfg.baseUrl && currentCfg.username && currentCfg.hasPassword);
  applyConfigToButtons();
  if (!configured) {
    ready = false;
    setConn('unknown');
    updateButtonsEnabled();
    setStatus('Not configured yet. Open Settings (⚙) to enter the server URL and login.', 'warn');
    return;
  }
  if (busy) return;
  setConn('working');
  setStatus('Checking connection…', null);
  const res = await api.test();
  if (busy) return; // an operation started while the test was in flight
  if (res.ok) {
    ready = true;
    setConn('ok');
    applyConfigToButtons();
    const who = res.user && res.user.display_name ? res.user.display_name : (res.user && res.user.username) || '';
    const haveGroups = slotGroupId('games') || slotGroupId('kiosks');
    setStatus('Connected' + (who ? ' as ' + who : '') + '.' +
      (haveGroups ? ' Ready.' : ' Open Settings (⚙) to pick your pause groups.'),
      haveGroups ? 'ok' : 'warn');
  } else {
    ready = false;
    setConn('error');
    updateButtonsEnabled();
    setStatus('Cannot connect: ' + res.error, 'error');
  }
}

// --------------------------------------------------------------------------
// Confirmation dialog (guards against accidental presses)
// --------------------------------------------------------------------------

// Modal confirm built from the same .overlay/.panel styling as Settings.
// Resolves true (confirmed) or false (cancelled / dismissed).
function confirmAction(opts) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'overlay confirm-overlay';

    const panel = document.createElement('div');
    panel.className = 'panel confirm-panel';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');

    const heading = document.createElement('h2');
    heading.textContent = opts.title;
    panel.appendChild(heading);

    const message = document.createElement('p');
    message.className = 'confirm-message';
    message.textContent = opts.message;
    panel.appendChild(message);

    const actions = document.createElement('div');
    actions.className = 'panel-actions';
    const spacer = document.createElement('span');
    spacer.className = 'spacer';
    actions.appendChild(spacer);

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-secondary';
    cancelBtn.textContent = 'Cancel';

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn-primary confirm-go' + (opts.tone ? ' ' + opts.tone : '');
    confirmBtn.textContent = opts.confirmLabel || 'Confirm';

    actions.appendChild(cancelBtn);
    actions.appendChild(confirmBtn);
    panel.appendChild(actions);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);

    function close(result) {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
      resolve(result);
    }
    function onKey(e) {
      if (e.key === 'Escape') close(false);
      else if (e.key === 'Enter') close(true);
    }

    cancelBtn.addEventListener('click', () => close(false));
    confirmBtn.addEventListener('click', () => close(true));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
    document.addEventListener('keydown', onKey);

    requestAnimationFrame(() => confirmBtn.focus());
  });
}

async function withBusy(subEl, workingText, fn) {
  busy = true;
  setConn('working');
  updateButtonsEnabled();
  subEl.textContent = workingText;
  try {
    await fn();
  } catch (e) {
    // fn (the IPC call + summarize) normally resolves with {ok:false} rather
    // than throwing, but guard anyway so the dot can't get stuck on 'working'.
    setStatus('Unexpected error: ' + (e && e.message ? e.message : String(e)), 'error');
    setConn('error');
  } finally {
    busy = false;
    subEl.textContent = 'Tap to start';
    // The run callback sets the connection dot from the actual result; here we
    // just restore button availability.
    updateButtonsEnabled();
  }
}

// --------------------------------------------------------------------------
// Result formatting (group pause/unpause response)
//   { success, action, group_name, changed, skipped, errors, details }
// --------------------------------------------------------------------------

function summarizeGroup(name, isPause, res) {
  if (!res.ok && !res.summary) {
    return { cls: 'error', text: 'Failed: ' + (res.error || 'unknown error'), detail: null };
  }
  const s = res.summary || {};
  if (s.error) {
    return { cls: 'error', text: '"' + name + '": ' + s.error, detail: null };
  }

  const changed = s.changed || 0;
  const skipped = s.skipped || 0;
  const errors = s.errors || 0;
  const didVerb = isPause ? 'Paused' : 'Unpaused';
  const stateWord = isPause ? 'paused' : 'running';

  const lines = [];
  if (skipped > 0) lines.push(skipped + ' skipped (out of service / unknown status).');

  let cls = 'ok';
  let head;
  if (errors > 0) {
    cls = 'warn';
    head = didVerb + ' ' + changed + ' in "' + name + '". ' + errors + ' busy — the server will keep retrying.';
  } else if (changed === 0) {
    head = '"' + name + '" already ' + stateWord + ' — nothing to change.';
  } else {
    head = didVerb + ' ' + changed + ' ' + (changed === 1 ? 'item' : 'items') + ' in "' + name + '".';
  }

  return { cls, text: head, detail: lines.length ? lines.join('\n') : null };
}

// --------------------------------------------------------------------------
// Wire up buttons
// --------------------------------------------------------------------------

for (const c of controls) {
  c.btn.addEventListener('click', async () => {
    if (busy || c.btn.disabled) return;

    const id = slotGroupId(c.slot);
    if (!id) {
      setStatus('No group selected for this button. Open Settings (⚙) and pick one.', 'warn');
      return;
    }
    const name = slotGroupName(c.slot) || ('Group #' + id);
    const isPause = c.action === 'pause';

    const ok = await confirmAction({
      title: (isPause ? 'Pause ' : 'Unpause ') + '"' + name + '"?',
      message: isPause
        ? 'This pauses every running game and kiosk in "' + name + '". Anything in active use is skipped and retried by the server.'
        : 'This unpauses every paused game and kiosk in "' + name + '".',
      confirmLabel: isPause ? 'Pause' : 'Unpause',
      tone: isPause ? 'pause' : 'unpause',
    });
    if (!ok) return;

    await withBusy(c.sub, (isPause ? 'Pausing' : 'Unpausing') + '…', async () => {
      setStatus((isPause ? 'Pausing' : 'Unpausing') + ' "' + name + '"…', null);
      const res = await c.run();
      const out = summarizeGroup(name, isPause, res);
      setStatus(out.text, out.cls, out.detail);
      setConn(out.cls === 'error' ? 'error' : 'ok');
    });
  });
}

// --------------------------------------------------------------------------
// Settings panel
// --------------------------------------------------------------------------

// (Re)fill a group <select> with a "none" choice + the live group list, keeping
// the stored selection visible even if the live list can't be loaded yet.
function fillGroupSelect(sel, groups, selectedId, selectedName) {
  while (sel.firstChild) sel.removeChild(sel.firstChild);

  const none = document.createElement('option');
  none.value = '';
  none.textContent = '— none —';
  sel.appendChild(none);

  let matched = false;
  (groups || []).forEach((g) => {
    const o = document.createElement('option');
    o.value = String(g.id);
    o.textContent = g.name + (g.is_active ? '' : ' (inactive)');
    if (selectedId != null && selectedId !== '' && String(g.id) === String(selectedId)) {
      o.selected = true;
      matched = true;
    }
    sel.appendChild(o);
  });

  // Preserve a stored selection that isn't in the (possibly empty) live list.
  if (!matched && selectedId != null && selectedId !== '') {
    const o = document.createElement('option');
    o.value = String(selectedId);
    o.textContent = (selectedName || ('Group #' + selectedId)) + ' (current)';
    o.selected = true;
    sel.appendChild(o);
  }
}

function readGroupSelection(sel) {
  const id = sel.value ? parseInt(sel.value, 10) : null;
  let name = '';
  if (id != null && sel.selectedIndex >= 0) {
    name = (sel.options[sel.selectedIndex].textContent || '').replace(/\s*\(.*\)\s*$/, '');
  }
  return { id, name };
}

async function loadGroupsIntoSelects() {
  const res = await api.getGroups();
  if (res && res.ok) {
    fillGroupSelect(el.cfgGamesGroup, res.groups, el.cfgGamesGroup.value || currentCfg.gamesGroupId, currentCfg.gamesGroupName);
    fillGroupSelect(el.cfgKiosksGroup, res.groups, el.cfgKiosksGroup.value || currentCfg.kiosksGroupId, currentCfg.kiosksGroupName);
  } else if (!el.cfgMsg.textContent) {
    el.cfgMsg.className = 'panel-msg';
    el.cfgMsg.textContent = 'Enter the server URL + login and click "Test connection" to load your pause groups.';
  }
}

async function openSettings() {
  currentCfg = await api.getConfig();
  el.cfgUrl.value = currentCfg.baseUrl || '';
  el.cfgUser.value = currentCfg.username || '';
  el.cfgPass.value = '';
  el.cfgPass.placeholder = currentCfg.hasPassword ? '(unchanged)' : 'password';
  el.cfgInsecure.checked = !!currentCfg.insecureTLS;
  el.encHint.textContent = currentCfg.encryptionAvailable
    ? 'Password is stored encrypted via the OS keychain.'
    : 'Warning: no OS keychain available — the password is stored in plain text in this app’s config folder. Use a dedicated low-privilege CEplay account.';
  el.cfgMsg.textContent = '';
  el.cfgMsg.className = 'panel-msg';

  // Seed the group dropdowns with the stored selections, then try to load the
  // live list (needs a working connection).
  fillGroupSelect(el.cfgGamesGroup, [], currentCfg.gamesGroupId, currentCfg.gamesGroupName);
  fillGroupSelect(el.cfgKiosksGroup, [], currentCfg.kiosksGroupId, currentCfg.kiosksGroupName);

  el.overlay.classList.remove('hidden');
  el.cfgUrl.focus();
  loadGroupsIntoSelects();
}

function closeSettings() {
  el.overlay.classList.add('hidden');
}

el.settingsBtn.addEventListener('click', openSettings);
el.cfgCancel.addEventListener('click', closeSettings);
el.overlay.addEventListener('click', (e) => { if (e.target === el.overlay) closeSettings(); });

el.cfgSave.addEventListener('click', async () => {
  el.cfgMsg.className = 'panel-msg';
  el.cfgMsg.textContent = 'Saving…';
  const games = readGroupSelection(el.cfgGamesGroup);
  const kiosks = readGroupSelection(el.cfgKiosksGroup);
  await api.setConfig({
    baseUrl: el.cfgUrl.value,
    username: el.cfgUser.value,
    password: el.cfgPass.value, // blank = keep existing
    insecureTLS: el.cfgInsecure.checked,
    gamesGroupId: games.id,
    gamesGroupName: games.name,
    kiosksGroupId: kiosks.id,
    kiosksGroupName: kiosks.name,
  });
  el.cfgMsg.className = 'panel-msg ok';
  el.cfgMsg.textContent = 'Saved.';
  closeSettings();
  refreshConnection();
});

el.cfgTest.addEventListener('click', async () => {
  // Persist first so the test uses exactly what's on screen. Group selections
  // are preserved by the main process even though we don't send them here.
  el.cfgMsg.className = 'panel-msg';
  el.cfgMsg.textContent = 'Testing…';
  await api.setConfig({
    baseUrl: el.cfgUrl.value,
    username: el.cfgUser.value,
    password: el.cfgPass.value,
    insecureTLS: el.cfgInsecure.checked,
  });
  el.cfgPass.value = '';
  const res = await api.test();
  if (res.ok) {
    const who = res.user && (res.user.display_name || res.user.username);
    el.cfgMsg.className = 'panel-msg ok';
    el.cfgMsg.textContent = 'Connected' + (who ? ' as ' + who : '') + '. Loading groups…';
    currentCfg = await api.getConfig();
    loadGroupsIntoSelects();
  } else {
    el.cfgMsg.className = 'panel-msg error';
    el.cfgMsg.textContent = res.error;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !el.overlay.classList.contains('hidden')) closeSettings();
});

// --------------------------------------------------------------------------
// Boot
// --------------------------------------------------------------------------

// Hide the logo gracefully if logo.png hasn't been dropped in yet, so the
// brand falls back to the wordmark instead of a broken-image icon.
const brandLogo = document.getElementById('brand-logo');
if (brandLogo) {
  brandLogo.addEventListener('error', () => brandLogo.classList.add('hero-logo--hidden'));
}

refreshConnection();

// --------------------------------------------------------------------------
// Demo-only: reset the simulated pause groups to the opening-time scenario.
// (Not present in the real Electron renderer.)
// --------------------------------------------------------------------------
const demoResetBtn = document.getElementById('demo-reset-btn');
if (demoResetBtn) {
  demoResetBtn.addEventListener('click', () => {
    if (busy) return;
    api.__reset();
    setConn('ok');
    setStatus('Demo reset — groups back to the opening scenario (most members paused). Tap a button to begin.', 'ok');
  });
}
  </script>
</body>
