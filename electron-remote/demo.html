<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CEplay Remote — single-file UI/UX demo.

    A browser-runnable showcase of the Electron "CEplay Remote" app
    (electron-remote/renderer/*). It uses the app's real markup, real styles,
    and real renderer logic verbatim. The only difference: the Electron IPC
    bridge (window.ceplay) is replaced with an in-memory mock that simulates a
    venue's games, kiosks, and pause groups — so the Controls view, the Status
    console (each group + its own readers, with per-asset pause/unpause/OOS),
    the confirmation dialog, and the Settings panel all work with NO server.

    Just open this file in any browser. Nothing leaves your machine.

    (The strict Content-Security-Policy from the real app's index.html is
    intentionally omitted here so the inlined CSS and JS can run from a
    standalone file. The packaged app keeps its CSP.)
  -->
  <title>CEplay Remote — UI Demo</title>
  <style>
/* ====================================================================== */
/* === electron-remote/renderer/styles.css (verbatim) =================== */
/* ====================================================================== */
:root {
  --bg: #0b0e14;
  --panel: #151a24;
  --panel-2: #1d2330;
  --text: #e1e4ed;
  --muted: #8b93a7;
  --border: #2a3142;
  --kiosks: #5b8def;
  --kiosks-hi: #6fa0ff;
  --unpause: #2bb673;
  --unpause-hi: #34d68b;
  --pause: #d9783a;
  --pause-hi: #e88c4d;
  --warn: #e0a32e;
  --error: #e5484d;
  --ok: #2bb673;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  user-select: none;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Top bar ---------------------------------------------------------------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.brand-text { font-size: 15px; letter-spacing: 0.2px; }

.dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--muted); flex: 0 0 auto;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
}
.dot[data-state="ok"]      { background: var(--ok); }
.dot[data-state="error"]   { background: var(--error); }
.dot[data-state="working"] { background: var(--warn); }
.dot[data-state="unknown"] { background: var(--muted); }

.icon-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; width: 38px; height: 38px; font-size: 18px; cursor: pointer;
}
.icon-btn:hover { background: var(--panel-2); }

/* Main ------------------------------------------------------------------- */
#main-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 22px;
  gap: 20px;
}

/* View nav (Controls / Status) + view containers ------------------------- */
.viewnav { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.viewnav-btn {
  border: none; background: transparent; color: var(--muted);
  font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer;
}
.viewnav-btn:hover { color: var(--text); }
.viewnav-btn.active { background: var(--panel-2); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.view.hidden { display: none; }

/* Hero logo above the action buttons ------------------------------------- */
.hero { display: flex; align-items: center; justify-content: center; padding: 4px 0 0; }
.hero-logo { max-height: 80px; max-width: 74%; height: auto; width: auto; object-fit: contain; }
.hero-logo--hidden { display: none; }
@media (max-height: 620px) { .hero-logo { max-height: 52px; } }

/* Group rows — one configurable pause group each, with Unpause/Pause ------ */
.groups {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: auto;
}
.group-row {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 11px 14px 13px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
}
.group-row-head { display: flex; align-items: baseline; gap: 10px; }
.group-row-name { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; color: var(--text); }
.group-row-hint { margin-left: auto; font-size: 12px; color: var(--muted); }
.group-row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Empty state when no group buttons are configured yet. */
.groups-empty {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  border: 1px dashed var(--border); border-radius: 14px; color: var(--muted);
  padding: 20px;
}
.groups-empty-text { margin: 0; font-size: 14px; }

.big-btn {
  border: none; border-radius: 12px; cursor: pointer; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 10px 12px; text-align: center; min-height: 56px;
  transition: transform 0.06s ease, filter 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
}
.big-btn:hover:not(:disabled) { filter: brightness(1.06); }
.big-btn:active:not(:disabled) { transform: translateY(2px); }
.big-btn:disabled { filter: grayscale(0.55) brightness(0.62); cursor: default; box-shadow: none; }

.big-btn-verb { font-size: 21px; font-weight: 800; line-height: 1.1; letter-spacing: 0.2px; }
.big-btn-sub { font-size: 12px; font-weight: 600; opacity: 0.92; min-height: 15px; }

.big-btn.unpause { background: linear-gradient(160deg, var(--unpause-hi), var(--unpause)); }
.big-btn.pause   { background: linear-gradient(160deg, var(--pause-hi), var(--pause)); }

/* ====================================================================== */
/* === Status console ==================================================== */
/* ====================================================================== */
.status-head { display: flex; align-items: center; gap: 10px; }
.status-title { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; }
.status-synced { font-size: 12px; color: var(--muted); margin-left: auto; }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* Shared status badge (group sections + asset rows) */
.state-badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.4px;
}
.state-badge.running { color: var(--ok); background: rgba(43, 182, 115, 0.14); }
.state-badge.paused  { color: var(--warn); background: rgba(224, 163, 46, 0.16); }
.state-badge.oos     { color: var(--error); background: rgba(229, 72, 77, 0.14); }
.state-badge.mixed   { color: var(--kiosks); background: rgba(91, 141, 239, 0.16); }
.state-badge.unknown, .state-badge.empty { color: var(--muted); background: rgba(139, 147, 167, 0.14); }

/* Search box */
.asset-search {
  flex: 0 0 auto; width: 100%; padding: 8px 11px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px;
}
.asset-search:focus { outline: 2px solid var(--kiosks); border-color: var(--kiosks); }

/* Asset rows (used inside group sections) */
.asset-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 12px; }
.asset-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
}
.asset-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.asset-name { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asset-meta { font-size: 11px; color: var(--muted); }
.asset-badge { flex: 0 0 auto; }
.asset-actions { display: flex; gap: 5px; flex: 0 0 auto; }
.asset-note { font-size: 11px; color: var(--muted); flex: 0 0 auto; }
.asset-btn {
  border: 1px solid var(--border); background: transparent; color: var(--text);
  font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 7px; cursor: pointer;
  transition: filter 0.12s ease, background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}
.asset-btn:disabled { opacity: 0.45; cursor: default; }
.asset-btn.unpause:hover:not(:disabled) { border-color: var(--unpause); color: var(--unpause-hi); }
.asset-btn.pause:hover:not(:disabled)   { border-color: var(--pause); color: var(--pause-hi); }
.asset-btn.oos:hover:not(:disabled)     { border-color: var(--error); color: var(--error); }

/* Per-group sections (Status page is organized by group) */
.group-sections { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.gsection { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
.gsection-head { display: flex; align-items: center; gap: 10px; padding: 11px 13px 9px; }
.gsection-name { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gsection-count { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; flex: 0 0 auto; }
.gsection-body { display: flex; flex-direction: column; gap: 6px; padding: 0 11px 11px; }
.gsection-body .asset-row { background: var(--bg); }
.gsection-empty { font-size: 13px; color: var(--muted); padding: 0 2px 10px; }

/* Confirmation dialog (reuses .overlay / .panel) ------------------------- */
.confirm-message { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text); }
.btn-primary.confirm-go.unpause { background: var(--unpause); border-color: var(--unpause); }
.btn-primary.confirm-go.unpause:hover { background: var(--unpause-hi); }
.btn-primary.confirm-go.pause   { background: var(--pause); border-color: var(--pause); }
.btn-primary.confirm-go.pause:hover   { background: var(--pause-hi); }
.btn-primary.confirm-go.oos     { background: var(--error); border-color: var(--error); }
.btn-primary.confirm-go.oos:hover     { filter: brightness(1.08); }

/* Status ----------------------------------------------------------------- */
.status {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  min-height: 64px;
}
.status-line { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text); }
.status-line .muted { color: var(--muted); }
.status-line.ok    { color: var(--ok); }
.status-line.warn  { color: var(--warn); }
.status-line.error { color: var(--error); }
.status-detail { margin: 8px 0 0; font-size: 13px; color: var(--muted); white-space: pre-line; }

/* Settings overlay ------------------------------------------------------- */
.overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.overlay.hidden { display: none; }

.panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 22px; width: 100%; max-width: 420px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  max-height: calc(100vh - 40px); overflow-y: auto;
}
.panel h2 { margin: 0 0 16px; font-size: 18px; }
.panel label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
.panel label.checkbox {
  display: flex; align-items: center; gap: 8px; color: var(--text); margin-top: 16px;
}
.panel input[type="url"], .panel input[type="text"], .panel input[type="password"], .panel select {
  width: 100%; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font-size: 14px;
}
.panel input:focus, .panel select:focus { outline: 2px solid var(--kiosks); border-color: var(--kiosks); }

.hint { font-size: 12px; color: var(--muted); margin: 14px 0 0; }
.hint-tight { margin: 4px 0 8px; }

/* Settings: editable list of pause-group buttons ------------------------- */
.group-list { display: flex; flex-direction: column; gap: 8px; }
.group-list-empty { font-size: 13px; color: var(--muted); padding: 4px 2px; }
.group-list-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
}
.group-list-name {
  flex: 1; font-size: 14px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.group-remove-btn {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
  transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
}
.group-remove-btn:hover { border-color: var(--error); color: var(--error); background: rgba(229, 72, 77, 0.08); }
.group-add { display: flex; gap: 8px; margin-top: 10px; }
.group-add select { flex: 1; }

.panel-actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
.panel-actions .spacer { flex: 1; }

.btn-primary, .btn-secondary {
  border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border);
}
.btn-primary { background: var(--kiosks); color: #fff; border-color: var(--kiosks); }
.btn-primary:hover { background: var(--kiosks-hi); }
.btn-secondary { background: var(--panel-2); color: var(--text); }
.btn-secondary:hover { background: #262d3c; }

.panel-msg { font-size: 13px; margin: 14px 0 0; min-height: 18px; }
.panel-msg.ok    { color: var(--ok); }
.panel-msg.error { color: var(--error); }

/* ====================================================================== */
/* === Demo harness (browser only — NOT part of the Electron app) ======= */
/* ====================================================================== */
html {
  min-height: 100%;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(91, 141, 239, 0.14), transparent 60%),
    radial-gradient(900px 500px at 90% 110%, rgba(43, 182, 115, 0.08), transparent 60%),
    #07090f;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
}
/* Frame the app like the real 780x680 desktop window. */
body {
  width: 780px;
  max-width: 100%;
  height: min(680px, calc(100vh - 56px));
  min-height: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
}
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.demo-chip {
  font-size: 10px; font-weight: 800; letter-spacing: 1.4px;
  color: var(--warn); border: 1px solid var(--warn); border-radius: 999px;
  padding: 2px 8px; margin-left: 2px; text-transform: uppercase; opacity: 0.9;
}
@media (max-width: 540px) {
  html { padding: 0; }
  body { border: none; border-radius: 0; height: 100vh; max-width: 100%; }
}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="conn-dot" data-state="unknown"></span>
      <span class="brand-text">CEplay Remote</span>
      <span class="demo-chip">Demo</span>
    </div>
    <nav class="viewnav" id="viewnav" aria-label="Views">
      <button class="viewnav-btn active" id="nav-controls" type="button" data-view="controls">Controls</button>
      <button class="viewnav-btn" id="nav-status" type="button" data-view="status">Status</button>
    </nav>
    <div class="topbar-actions">
      <button id="demo-reset-btn" class="icon-btn" title="Reset demo state" aria-label="Reset demo state">&#8635;</button>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
    </div>
  </header>

  <main id="main-view">
    <section class="view" id="view-controls">
      <div class="hero">
        <img class="hero-logo" id="brand-logo" src="renderer/logo.png" alt="CEplay" />
      </div>
      <div class="groups" id="groups"></div>
    </section>

    <section class="view hidden" id="view-status">
      <div class="status-head">
        <span class="status-title">Live status</span>
        <span class="status-synced" id="status-synced"></span>
        <button id="status-refresh" class="btn-secondary btn-sm" type="button">Refresh</button>
      </div>
      <input type="text" id="asset-search" class="asset-search" placeholder="Search for a game or kiosk…" autocomplete="off" />
      <div class="group-sections" id="group-sections"></div>
    </section>

    <section class="status" id="status" aria-live="polite">
      <p class="status-line" id="status-line">Checking connection&hellip;</p>
    </section>
  </main>

  <!-- Settings panel -->
  <div class="overlay hidden" id="settings-overlay">
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>

      <label for="cfg-url">CEplay server URL</label>
      <input type="url" id="cfg-url" placeholder="https://ceplay.local" autocomplete="off" />

      <label for="cfg-user">Username</label>
      <input type="text" id="cfg-user" placeholder="frontdesk" autocomplete="off" />

      <label for="cfg-pass">Password</label>
      <input type="password" id="cfg-pass" placeholder="(unchanged)" autocomplete="off" />

      <label>Pause-group buttons</label>
      <p class="hint hint-tight">Each group you add gets an Unpause and a Pause button on the Controls screen.</p>
      <div class="group-list" id="group-list"></div>
      <div class="group-add">
        <select id="group-add-select"></select>
        <button id="group-add-btn" class="btn-secondary" type="button">Add</button>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="cfg-insecure" />
        Allow self-signed TLS certificate (LAN only)
      </label>

      <p class="hint" id="enc-hint"></p>

      <div class="panel-actions">
        <button id="cfg-test" class="btn-secondary">Test connection</button>
        <span class="spacer"></span>
        <button id="cfg-cancel" class="btn-secondary">Close</button>
        <button id="cfg-save" class="btn-primary">Save</button>
      </div>

      <p class="panel-msg" id="cfg-msg"></p>
    </div>
  </div>

  <!-- ================================================================== -->
  <!-- Mock IPC bridge: stands in for the Electron preload `window.ceplay` -->
  <!-- (electron-remote/preload.js). Simulates a venue of games + kiosks   -->
  <!-- grouped into pause groups, so Controls, the Status console, and the -->
  <!-- Settings editor all work with no server.                            -->
  <!-- ================================================================== -->
  <script>
    window.ceplay = (function () {
      'use strict';

      var ERRORS = ['unit in use', 'active play in progress', 'reader busy', 'timed out'];

      // 16 arcade games (group 1) + 8 outdoor attractions (group 3).
      var GAME_NAMES = [
        'Skee-Ball', 'Air Hockey', 'Whac-A-Mole', 'Pac-Man', 'Hoop Fever', 'Dance Stage',
        'Crane Claw', 'Ticket Blaster', 'Jurassic Smash', 'Race Kart', 'Pinball', 'Coin Pusher',
        'Basketball', 'Whack Attack', 'Spin Zone', 'Token Toss',
        'Go-Karts', 'Mini Golf', 'Bumper Boats', 'Zip Line', 'Ropes Course', 'Batting Cage',
        'Carousel', 'Ferris Wheel'
      ];

      function gameRange(a, b) { var o = []; for (var i = a; i <= b; i++) o.push({ type: 'game', id: 'g' + i }); return o; }
      function kioskRange(a, b) { var o = []; for (var i = a; i <= b; i++) o.push({ type: 'kiosk', id: 'k' + i }); return o; }

      var GROUP_DEFS = [
        { id: 1, name: 'Arcade Games',         is_active: 1, members: gameRange(1, 16) },
        { id: 2, name: 'Arcade Kiosks',        is_active: 1, members: kioskRange(1, 5) },
        { id: 3, name: 'Outdoor Attractions',  is_active: 1, members: gameRange(17, 24) },
        { id: 4, name: 'Redemption Center',    is_active: 1, members: gameRange(7, 12) },
        { id: 5, name: 'Laser Tag (seasonal)', is_active: 0, members: gameRange(13, 15) }
      ];

      // Opening-time scenario: mostly paused, a couple running, one OOS, one
      // kiosk with unknown status (not controllable).
      function freshAssets() {
        var games = GAME_NAMES.map(function (n, i) {
          var id = 'g' + (i + 1);
          var status = 'paused';
          if (id === 'g3' || id === 'g7' || id === 'g18') status = 'enabled';
          if (id === 'g5') status = 'outOfService';
          return { id: id, name: n, status: status };
        });
        var kiosks = [1, 2, 3, 4, 5].map(function (n) {
          return { id: 'k' + n, name: 'Kiosk ' + n, status: n === 5 ? 'unknown' : 'paused' };
        });
        return { games: games, kiosks: kiosks };
      }

      var assets = freshAssets();
      var config = {
        baseUrl: 'https://ceplay.demo.local',
        username: 'frontdesk',
        hasPassword: true,
        insecureTLS: false,
        encryptionAvailable: true,
        groups: [
          { id: 1, name: 'Arcade Games' },
          { id: 2, name: 'Arcade Kiosks' },
          { id: 3, name: 'Outdoor Attractions' }
        ]
      };

      function findAsset(type, id) {
        var arr = type === 'kiosk' ? assets.kiosks : assets.games;
        for (var i = 0; i < arr.length; i++) if (String(arr[i].id) === String(id)) return arr[i];
        return null;
      }
      function findDef(id) {
        for (var i = 0; i < GROUP_DEFS.length; i++) if (String(GROUP_DEFS[i].id) === String(id)) return GROUP_DEFS[i];
        return null;
      }
      function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      function deriveGroup(def) {
        var e = 0, p = 0, o = 0;
        var gameIds = [], kioskIds = [];
        def.members.forEach(function (m) {
          var as = findAsset(m.type, m.id);
          if (!as) return;
          if (m.type === 'kiosk') kioskIds.push(as.id); else gameIds.push(as.id);
          if (as.status === 'enabled') e++;
          else if (as.status === 'paused') p++;
          else if (as.status === 'outOfService') o++;
        });
        var state = def.members.length === 0 ? 'empty'
          : (e > 0 && p === 0 && o === 0) ? 'enabled'
          : (p > 0 && e === 0 && o === 0) ? 'paused'
          : (e > 0 || p > 0 || o > 0) ? 'mixed' : 'empty';
        return {
          id: def.id, name: def.name, state: state, total: def.members.length,
          enabled: e, paused: p, oos: o, gameIds: gameIds, kioskIds: kioskIds
        };
      }

      function applyGroupAction(def, action) {
        var target = action === 'pause' ? 'paused' : 'enabled';
        var from = action === 'pause' ? 'enabled' : 'paused';
        var changed = 0, skipped = 0, errors = 0;
        var details = { changed: [], skipped: [], errors: [] };
        def.members.forEach(function (m) {
          var as = findAsset(m.type, m.id);
          if (!as) return;
          if (as.status === 'outOfService' || as.status === 'unknown') { skipped++; details.skipped.push(as.name); return; }
          if (as.status === target) return;
          if (as.status === from) {
            if (Math.random() < 0.1) {
              errors++;
              details.errors.push({ id: as.name, error: ERRORS[Math.floor(Math.random() * ERRORS.length)] });
            } else {
              as.status = target; changed++; details.changed.push(as.name);
            }
          }
        });
        return {
          success: errors === 0, action: action, group_id: def.id, group_name: def.name,
          changed: changed, skipped: skipped, errors: errors, details: details
        };
      }

      return {
        getConfig: function () { return Promise.resolve(Object.assign({}, config, { groups: config.groups.slice() })); },
        setConfig: function (cfg) {
          if (!cfg) return Promise.resolve({ ok: true });
          if (cfg.baseUrl !== undefined) config.baseUrl = cfg.baseUrl;
          if (cfg.username !== undefined) config.username = cfg.username;
          if (cfg.password) config.hasPassword = true;
          if (cfg.insecureTLS !== undefined) config.insecureTLS = cfg.insecureTLS;
          if (Array.isArray(cfg.groups)) {
            config.groups = cfg.groups
              .map(function (g) { return { id: parseInt(g && g.id, 10), name: String((g && g.name) || '') }; })
              .filter(function (g) { return !isNaN(g.id); })
              .map(function (g) { return { id: g.id, name: g.name || ('Group #' + g.id) }; });
          }
          return Promise.resolve({ ok: true });
        },
        test: function () {
          return delay(600).then(function () {
            if (config.baseUrl && config.username && config.hasPassword) {
              return {
                ok: true,
                user: { display_name: 'Front Desk (Demo)', username: config.username },
                status: 'ok',
                health: { status: 'ok', watchdogHealthy: true, retriesPending: 0, retriesGaveUp: 0 }
              };
            }
            return { ok: false, error: 'Missing server URL or credentials.' };
          });
        },
        getGroups: function () {
          return delay(250).then(function () {
            return { ok: true, groups: GROUP_DEFS.map(function (g) { return { id: g.id, name: g.name, is_active: g.is_active }; }) };
          });
        },
        groupAction: function (groupId, action) {
          var def = findDef(groupId);
          if (!def) return Promise.resolve({ ok: false, error: 'Selected group no longer exists.' });
          return delay(850).then(function () {
            var summary = applyGroupAction(def, action);
            return { ok: summary.success !== false, summary: summary };
          });
        },
        getStatus: function () {
          return delay(250).then(function () {
            return {
              ok: true,
              games: assets.games.map(function (g) { return { id: g.id, name: g.name, status: g.status }; }),
              kiosks: assets.kiosks.map(function (k) { return { id: k.id, name: k.name, status: k.status }; }),
              kioskPauseSupported: true,
              groups: GROUP_DEFS.map(deriveGroup),
              lastSynced: new Date().toISOString()
            };
          });
        },
        setAssetStatus: function (type, id, status) {
          return delay(450).then(function () {
            var as = findAsset(type, id);
            if (!as) return { ok: false, error: 'Asset not found.' };
            // Occasionally a game is busy (in active play) — server will retry.
            if (type === 'game' && Math.random() < 0.08) return { ok: false, busy: true, error: 'unit in use' };
            as.status = status;
            return { ok: true, status: status };
          });
        },

        // Demo-only helper used by the reset button.
        __reset: function () { assets = freshAssets(); }
      };
    })();
  </script>

  <!-- ================================================================== -->
  <!-- electron-remote/renderer/renderer.js (verbatim), plus a small       -->
  <!-- demo-only reset hook appended at the very end.                      -->
  <!-- ================================================================== -->
  <script>
'use strict';

/* global window, document */

const api = window.ceplay;

const el = {
  connDot: document.getElementById('conn-dot'),
  statusLine: document.getElementById('status-line'),
  status: document.getElementById('status'),
  // views + nav
  navControls: document.getElementById('nav-controls'),
  navStatus: document.getElementById('nav-status'),
  viewControls: document.getElementById('view-controls'),
  viewStatus: document.getElementById('view-status'),
  groups: document.getElementById('groups'),
  // status view
  statusSynced: document.getElementById('status-synced'),
  statusRefresh: document.getElementById('status-refresh'),
  assetSearch: document.getElementById('asset-search'),
  groupSections: document.getElementById('group-sections'),
  // settings
  settingsBtn: document.getElementById('settings-btn'),
  overlay: document.getElementById('settings-overlay'),
  cfgUrl: document.getElementById('cfg-url'),
  cfgUser: document.getElementById('cfg-user'),
  cfgPass: document.getElementById('cfg-pass'),
  cfgInsecure: document.getElementById('cfg-insecure'),
  groupList: document.getElementById('group-list'),
  groupAddSelect: document.getElementById('group-add-select'),
  groupAddBtn: document.getElementById('group-add-btn'),
  cfgSave: document.getElementById('cfg-save'),
  cfgCancel: document.getElementById('cfg-cancel'),
  cfgTest: document.getElementById('cfg-test'),
  cfgMsg: document.getElementById('cfg-msg'),
  encHint: document.getElementById('enc-hint'),
};

let busy = false;        // a group action is in flight (Controls view)
let configured = false;  // server URL + login are set
let ready = false;       // connection test passed
let currentCfg = {};     // last config read from the main process
let controls = [];       // live group-button controls: [{ id, name, action, btn, sub }]
let currentView = 'controls';

// Status view state
let statusData = { games: [], kiosks: [], groups: [], kioskPauseSupported: false };
let assetSearch = '';
let assetActionInFlight = false;
let statusPollCleanup = null;

// Settings working state
let editGroups = [];
let allGroups = [];
let groupsLoaded = false;

// --------------------------------------------------------------------------
// Small DOM helpers
// --------------------------------------------------------------------------

function clearEl(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function makeEl(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text != null) e.textContent = text;
  return e;
}

function makeOption(value, text, disabled) {
  const o = document.createElement('option');
  o.value = value;
  o.textContent = text;
  if (disabled) o.disabled = true;
  return o;
}

// --------------------------------------------------------------------------
// Status helpers (shared bottom status line)
// --------------------------------------------------------------------------

function setConn(state) { el.connDot.dataset.state = state; }

function setStatus(text, cls, detail) {
  el.statusLine.className = 'status-line' + (cls ? ' ' + cls : '');
  el.statusLine.textContent = text;
  const existing = document.getElementById('status-detail');
  if (existing) existing.remove();
  if (detail) {
    const p = makeEl('p', 'status-detail', detail);
    p.id = 'status-detail';
    el.status.appendChild(p);
  }
}

// --------------------------------------------------------------------------
// View switching
// --------------------------------------------------------------------------

function switchView(name) {
  currentView = name;
  el.viewControls.classList.toggle('hidden', name !== 'controls');
  el.viewStatus.classList.toggle('hidden', name !== 'status');
  el.navControls.classList.toggle('active', name === 'controls');
  el.navStatus.classList.toggle('active', name === 'status');
  if (name === 'status') {
    renderGroupSections();
    if (ready) { loadStatus(); startStatusPolling(); }
  } else {
    stopStatusPolling();
  }
}

el.navControls.addEventListener('click', () => switchView('controls'));
el.navStatus.addEventListener('click', () => switchView('status'));

// --------------------------------------------------------------------------
// Controls view — one card per configured pause group, each Unpause/Pause.
// --------------------------------------------------------------------------

function configuredGroups() {
  return Array.isArray(currentCfg.groups) ? currentCfg.groups : [];
}

function renderGroupCards() {
  clearEl(el.groups);
  controls = [];

  const list = configuredGroups();
  if (list.length === 0) {
    const empty = makeEl('div', 'groups-empty');
    empty.appendChild(makeEl('p', 'groups-empty-text', 'No pause-group buttons yet.'));
    const btn = makeEl('button', 'btn-secondary', 'Open Settings');
    btn.type = 'button';
    btn.addEventListener('click', openSettings);
    empty.appendChild(btn);
    el.groups.appendChild(empty);
    return;
  }

  list.forEach((g) => {
    const name = g.name || ('Group #' + g.id);
    const row = makeEl('section', 'group-row');
    row.setAttribute('data-group-id', String(g.id));

    const head = makeEl('div', 'group-row-head');
    head.appendChild(makeEl('span', 'group-row-name', name));
    row.appendChild(head);

    const actions = makeEl('div', 'group-row-actions');
    [['unpause', 'Unpause'], ['pause', 'Pause']].forEach(function (pair) {
      const action = pair[0];
      const btn = makeEl('button', 'big-btn ' + action);
      btn.type = 'button';
      btn.disabled = true;
      btn.appendChild(makeEl('span', 'big-btn-verb', pair[1]));
      const sub = makeEl('span', 'big-btn-sub', 'Tap to start');
      btn.appendChild(sub);
      const ctrl = { id: g.id, name: name, action: action, btn: btn, sub: sub };
      btn.addEventListener('click', function () { onActionClick(ctrl); });
      actions.appendChild(btn);
      controls.push(ctrl);
    });
    row.appendChild(actions);
    el.groups.appendChild(row);
  });

  updateButtonsEnabled();
}

function updateButtonsEnabled() {
  for (const c of controls) c.btn.disabled = !(ready && !busy);
}

async function onActionClick(ctrl) {
  if (busy || ctrl.btn.disabled) return;
  const isPause = ctrl.action === 'pause';

  const ok = await confirmAction({
    title: (isPause ? 'Pause ' : 'Unpause ') + '"' + ctrl.name + '"?',
    message: isPause
      ? 'This pauses every running game and kiosk in "' + ctrl.name + '". Anything in active use is skipped and retried by the server.'
      : 'This unpauses every paused game and kiosk in "' + ctrl.name + '".',
    confirmLabel: isPause ? 'Pause' : 'Unpause',
    tone: isPause ? 'pause' : 'unpause',
  });
  if (!ok) return;

  await withBusy(ctrl.sub, (isPause ? 'Pausing' : 'Unpausing') + '…', async () => {
    setStatus((isPause ? 'Pausing' : 'Unpausing') + ' "' + ctrl.name + '"…', null);
    const res = await api.groupAction(ctrl.id, ctrl.action);
    const out = summarizeGroup(ctrl.name, isPause, res);
    setStatus(out.text, out.cls, out.detail);
    setConn(out.cls === 'error' ? 'error' : 'ok');
  });
}

// --------------------------------------------------------------------------
// Confirmation dialog (group "pause/unpause all" + per-asset "out of service")
// --------------------------------------------------------------------------

function confirmAction(opts) {
  return new Promise((resolve) => {
    const overlay = makeEl('div', 'overlay confirm-overlay');
    const panel = makeEl('div', 'panel confirm-panel');
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');

    panel.appendChild(makeEl('h2', null, opts.title));
    panel.appendChild(makeEl('p', 'confirm-message', opts.message));

    const actions = makeEl('div', 'panel-actions');
    actions.appendChild(makeEl('span', 'spacer'));
    const cancelBtn = makeEl('button', 'btn-secondary', 'Cancel');
    const confirmBtn = makeEl('button', 'btn-primary confirm-go' + (opts.tone ? ' ' + opts.tone : ''), opts.confirmLabel || 'Confirm');
    actions.appendChild(cancelBtn);
    actions.appendChild(confirmBtn);
    panel.appendChild(actions);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);

    function close(result) {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
      resolve(result);
    }
    function onKey(e) {
      if (e.key === 'Escape') close(false);
      else if (e.key === 'Enter') close(true);
    }
    cancelBtn.addEventListener('click', () => close(false));
    confirmBtn.addEventListener('click', () => close(true));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(() => confirmBtn.focus());
  });
}

async function withBusy(subEl, workingText, fn) {
  busy = true;
  setConn('working');
  updateButtonsEnabled();
  subEl.textContent = workingText;
  try {
    await fn();
  } catch (e) {
    setStatus('Unexpected error: ' + (e && e.message ? e.message : String(e)), 'error');
    setConn('error');
  } finally {
    busy = false;
    subEl.textContent = 'Tap to start';
    updateButtonsEnabled();
  }
}

function summarizeGroup(name, isPause, res) {
  if (!res.ok && !res.summary) {
    return { cls: 'error', text: 'Failed: ' + (res.error || 'unknown error'), detail: null };
  }
  const s = res.summary || {};
  if (s.error) return { cls: 'error', text: '"' + name + '": ' + s.error, detail: null };

  const changed = s.changed || 0;
  const skipped = s.skipped || 0;
  const errors = s.errors || 0;
  const didVerb = isPause ? 'Paused' : 'Unpaused';
  const stateWord = isPause ? 'paused' : 'running';

  const lines = [];
  if (skipped > 0) lines.push(skipped + ' skipped (out of service / unknown status).');

  let cls = 'ok';
  let head;
  if (errors > 0) {
    cls = 'warn';
    head = didVerb + ' ' + changed + ' in "' + name + '". ' + errors + ' busy — the server will keep retrying.';
    lines.push('Busy items are queued on the server; its per-minute watchdog re-attempts them automatically.');
  } else if (changed === 0) {
    head = '"' + name + '" already ' + stateWord + ' — nothing to change.';
  } else {
    head = didVerb + ' ' + changed + ' ' + (changed === 1 ? 'item' : 'items') + ' in "' + name + '".';
  }
  return { cls, text: head, detail: lines.length ? lines.join('\n') : null };
}

// --------------------------------------------------------------------------
// Status view — each configured group with only its own readers, plus
// individual pause / unpause / out-of-service.
// --------------------------------------------------------------------------

function statusBadge(status) {
  if (status === 'enabled') return { label: 'Running', cls: 'running' };
  if (status === 'paused') return { label: 'Paused', cls: 'paused' };
  if (status === 'outOfService') return { label: 'OOS', cls: 'oos' };
  return { label: 'Unknown', cls: 'unknown' };
}

function groupBadge(state) {
  if (state === 'enabled') return { label: 'Running', cls: 'running' };
  if (state === 'paused') return { label: 'Paused', cls: 'paused' };
  if (state === 'mixed') return { label: 'Mixed', cls: 'mixed' };
  if (state === 'empty') return { label: 'Empty', cls: 'empty' };
  return { label: 'Unknown', cls: 'unknown' };
}

// Surface problems first: Out of service, then Paused, then Unknown, then
// Running — alphabetical within each tier.
function statusRank(s) {
  const order = { outOfService: 0, paused: 1, unknown: 2, enabled: 3 };
  return order[s] != null ? order[s] : 9;
}

function memberCountText(g) {
  const parts = [g.enabled + ' running', g.paused + ' paused'];
  if (g.oos > 0) parts.push(g.oos + ' OOS');
  return parts.join(' · ');
}

function assetActions(a) {
  const wrap = makeEl('div', 'asset-actions');
  const controllable = a.type === 'game' || (statusData.kioskPauseSupported && a.status !== 'unknown');
  if (!controllable) {
    wrap.appendChild(makeEl('span', 'asset-note', a.type === 'kiosk' ? 'no control' : '—'));
    return wrap;
  }
  [['enabled', 'Unpause', 'unpause'], ['paused', 'Pause', 'pause'], ['outOfService', 'OOS', 'oos']].forEach((t) => {
    if (a.status === t[0]) return;
    const btn = makeEl('button', 'asset-btn ' + t[2], t[1]);
    btn.type = 'button';
    btn.disabled = !(ready && !assetActionInFlight);
    btn.addEventListener('click', () => onAssetAction(a, t[0], t[1]));
    wrap.appendChild(btn);
  });
  return wrap;
}

function renderAssetRow(a) {
  const row = makeEl('div', 'asset-row');
  row.setAttribute('data-asset', a.type + ':' + a.id);
  const info = makeEl('div', 'asset-info');
  info.appendChild(makeEl('div', 'asset-name', a.name));
  info.appendChild(makeEl('div', 'asset-meta', a.type === 'kiosk' ? 'Kiosk' : 'Game'));
  row.appendChild(info);
  const badge = statusBadge(a.status);
  row.appendChild(makeEl('span', 'state-badge ' + badge.cls + ' asset-badge', badge.label));
  row.appendChild(assetActions(a));
  return row;
}

function renderGroupSections() {
  const top = el.groupSections.scrollTop;
  clearEl(el.groupSections);

  if (!ready) {
    el.groupSections.appendChild(makeEl('div', 'asset-empty', 'Connect to the server to see live status.'));
    return;
  }

  const configured = configuredGroups();
  if (configured.length === 0) {
    const empty = makeEl('div', 'groups-empty');
    empty.appendChild(makeEl('p', 'groups-empty-text', 'No groups yet. Add one in Settings to see its games and kiosks here.'));
    const btn = makeEl('button', 'btn-secondary', 'Open Settings');
    btn.type = 'button';
    btn.addEventListener('click', openSettings);
    empty.appendChild(btn);
    el.groupSections.appendChild(empty);
    return;
  }

  const gById = {}; (statusData.groups || []).forEach((g) => { gById[String(g.id)] = g; });
  const gamesById = {}; (statusData.games || []).forEach((a) => { gamesById[String(a.id)] = a; });
  const kiosksById = {}; (statusData.kiosks || []).forEach((a) => { kiosksById[String(a.id)] = a; });
  const q = assetSearch.trim().toLowerCase();
  let anyShown = false;

  configured.forEach((cg) => {
    const g = gById[String(cg.id)];
    const members = [];
    if (g) {
      (g.gameIds || []).forEach((id) => { const m = gamesById[String(id)]; if (m) members.push({ type: 'game', id: m.id, name: m.name, status: m.status }); });
      (g.kioskIds || []).forEach((id) => { const m = kiosksById[String(id)]; if (m) members.push({ type: 'kiosk', id: m.id, name: m.name, status: m.status }); });
    }
    let shown = members;
    if (q) shown = members.filter((a) => a.name.toLowerCase().indexOf(q) !== -1);
    if (q && shown.length === 0) return; // hide non-matching groups while searching
    anyShown = true;
    shown.sort((a, b) => {
      const r = statusRank(a.status) - statusRank(b.status);
      return r !== 0 ? r : a.name.localeCompare(b.name);
    });

    const sec = makeEl('section', 'gsection');
    const head = makeEl('div', 'gsection-head');
    head.appendChild(makeEl('span', 'gsection-name', cg.name || ('Group #' + cg.id)));
    const st = g ? groupBadge(g.state) : { label: '?', cls: 'unknown' };
    head.appendChild(makeEl('span', 'state-badge ' + st.cls, st.label));
    head.appendChild(makeEl('span', 'gsection-count', g ? memberCountText(g) : 'unavailable'));
    sec.appendChild(head);

    const body = makeEl('div', 'gsection-body');
    if (!g) {
      body.appendChild(makeEl('div', 'gsection-empty', 'This group was not found on the server.'));
    } else if (shown.length === 0) {
      body.appendChild(makeEl('div', 'gsection-empty', 'No games or kiosks in this group yet.'));
    } else {
      shown.forEach((a) => body.appendChild(renderAssetRow(a)));
    }
    sec.appendChild(body);
    el.groupSections.appendChild(sec);
  });

  if (q && !anyShown) {
    el.groupSections.appendChild(makeEl('div', 'asset-empty', 'No games or kiosks match "' + assetSearch.trim() + '".'));
  }
  el.groupSections.scrollTop = top;
}

function updateLocalAsset(a) {
  const arr = a.type === 'kiosk' ? statusData.kiosks : statusData.games;
  const m = (arr || []).find((x) => String(x.id) === String(a.id));
  if (m) m.status = a.status;
}

async function onAssetAction(a, target, label) {
  if (assetActionInFlight || !ready) return;

  // Tagging an asset out of service is more consequential than a quick
  // pause/unpause, so confirm that one (pause/unpause stay one-tap).
  if (target === 'outOfService') {
    const ok = await confirmAction({
      title: 'Tag "' + a.name + '" out of service?',
      message: '"' + a.name + '" will be marked Out of Service in CEplay and stop accepting plays until you set it back to Running.',
      confirmLabel: 'Out of service',
      tone: 'oos',
    });
    if (!ok) return;
  }

  assetActionInFlight = true;
  renderGroupSections(); // disables action buttons while in flight
  setStatus('Setting "' + a.name + '" to ' + label + '…', null);

  let res;
  try {
    res = await api.setAssetStatus(a.type, a.id, target);
  } catch (e) {
    res = { ok: false, error: e && e.message ? e.message : String(e) };
  }

  if (res && res.ok) {
    a.status = target;
    updateLocalAsset(a);
    setStatus('"' + a.name + '" → ' + label + '.', 'ok');
  } else if (res && res.busy) {
    setStatus('"' + a.name + '" is busy — the server will keep retrying.', 'warn');
  } else {
    setStatus('Failed to update "' + a.name + '": ' + ((res && res.error) || 'unknown error'), 'error');
  }

  assetActionInFlight = false;
  renderGroupSections();
  // Reconcile from the server shortly (covers busy/retry + group counts).
  setTimeout(() => { if (currentView === 'status' && !assetActionInFlight) loadStatus(); }, 1600);
}

async function loadStatus() {
  if (!ready) { renderGroupSections(); return; }
  if (assetActionInFlight) return;
  const res = await api.getStatus();
  if (currentView !== 'status') return;
  if (res && res.ok) {
    statusData = res;
    el.statusSynced.textContent = 'Updated ' + new Date().toLocaleTimeString();
    renderGroupSections();
  } else {
    el.statusSynced.textContent = '';
    clearEl(el.groupSections);
    el.groupSections.appendChild(makeEl('div', 'asset-empty', 'Could not load status: ' + ((res && res.error) || 'unknown error')));
  }
}

function startStatusPolling() {
  stopStatusPolling();
  const tick = () => {
    if (currentView === 'status' && ready && !document.hidden && !assetActionInFlight) loadStatus();
  };
  const iv = setInterval(tick, 12000);
  const vis = () => { if (!document.hidden) tick(); };
  document.addEventListener('visibilitychange', vis);
  statusPollCleanup = () => { clearInterval(iv); document.removeEventListener('visibilitychange', vis); };
}

function stopStatusPolling() {
  if (statusPollCleanup) { statusPollCleanup(); statusPollCleanup = null; }
}

el.statusRefresh.addEventListener('click', () => { if (ready) loadStatus(); });
el.assetSearch.addEventListener('input', () => { assetSearch = el.assetSearch.value; renderGroupSections(); });

// --------------------------------------------------------------------------
// Connection check
// --------------------------------------------------------------------------

async function refreshConnection() {
  if (busy) return;
  currentCfg = await api.getConfig();
  configured = !!(currentCfg.baseUrl && currentCfg.username && currentCfg.hasPassword);
  renderGroupCards();
  if (currentView === 'status') renderGroupSections();
  if (!configured) {
    ready = false;
    stopStatusPolling();
    setConn('unknown');
    updateButtonsEnabled();
    setStatus('Not configured yet. Open Settings (⚙) to enter the server URL and login.', 'warn');
    return;
  }
  if (busy) return;
  setConn('working');
  setStatus('Checking connection…', null);
  const res = await api.test();
  if (busy) return;
  if (res.ok) {
    ready = true;
    setConn('ok');
    updateButtonsEnabled();
    const who = res.user && res.user.display_name ? res.user.display_name : (res.user && res.user.username) || '';
    const haveGroups = configuredGroups().length > 0;
    setStatus('Connected' + (who ? ' as ' + who : '') + '.' +
      (haveGroups ? ' Ready.' : ' Open Settings (⚙) to add a pause group.'),
      haveGroups ? 'ok' : 'warn');
    maybeWarnWatchdog(res);
    if (currentView === 'status') { loadStatus(); startStatusPolling(); }
  } else {
    ready = false;
    stopStatusPolling();
    setConn('error');
    updateButtonsEnabled();
    if (currentView === 'status') renderGroupSections();
    setStatus('Cannot connect: ' + res.error, 'error');
  }
}

function maybeWarnWatchdog(res) {
  const h = res && res.health;
  if (!h) return;
  if (h.watchdogHealthy === false) {
    setStatus(el.statusLine.textContent, 'warn',
      'Heads up: the server’s per-minute watchdog hasn’t run recently, so retries of busy assets may not process. Check the cron_watchdog cron on the CEplay server.');
  } else if (typeof h.retriesGaveUp === 'number' && h.retriesGaveUp > 0) {
    setStatus(el.statusLine.textContent, 'warn',
      h.retriesGaveUp + ' asset(s) on the server gave up after exhausting retries. They’ll be re-tried after a cooldown, or on the next action.');
  }
}

// --------------------------------------------------------------------------
// Settings panel — server/login + the dynamic group-button editor
// --------------------------------------------------------------------------

function renderGroupEditor() {
  clearEl(el.groupList);
  if (editGroups.length === 0) {
    el.groupList.appendChild(makeEl('div', 'group-list-empty', 'No buttons yet — add a group below.'));
    return;
  }
  editGroups.forEach((g, idx) => {
    const row = makeEl('div', 'group-list-row');
    row.appendChild(makeEl('span', 'group-list-name', g.name || ('Group #' + g.id)));
    const rm = makeEl('button', 'group-remove-btn', '×');
    rm.type = 'button';
    rm.title = 'Remove';
    rm.setAttribute('aria-label', 'Remove ' + (g.name || ('Group #' + g.id)));
    rm.addEventListener('click', () => {
      editGroups.splice(idx, 1);
      renderGroupEditor();
      refreshAddSelect();
    });
    row.appendChild(rm);
    el.groupList.appendChild(row);
  });
}

function refreshAddSelect() {
  const sel = el.groupAddSelect;
  clearEl(sel);
  if (!groupsLoaded) {
    sel.appendChild(makeOption('', 'Connect to load groups…', true));
    el.groupAddBtn.disabled = true;
    return;
  }
  const added = new Set(editGroups.map((g) => String(g.id)));
  const available = allGroups.filter((g) => !added.has(String(g.id)));
  if (available.length === 0) {
    sel.appendChild(makeOption('', allGroups.length ? 'All groups added' : 'No pause groups found', true));
    el.groupAddBtn.disabled = true;
    return;
  }
  const placeholder = makeOption('', 'Choose a group to add…', true);
  placeholder.selected = true;
  sel.appendChild(placeholder);
  available.forEach((g) => sel.appendChild(makeOption(String(g.id), g.name + (g.is_active ? '' : ' (inactive)'))));
  el.groupAddBtn.disabled = false;
}

function addSelectedGroup() {
  const id = el.groupAddSelect.value ? parseInt(el.groupAddSelect.value, 10) : null;
  if (!id) return;
  if (editGroups.some((g) => String(g.id) === String(id))) return;
  const match = allGroups.find((g) => String(g.id) === String(id));
  editGroups.push({ id: id, name: match ? match.name : ('Group #' + id) });
  renderGroupEditor();
  refreshAddSelect();
}

async function loadGroupsForAdd() {
  const res = await api.getGroups();
  if (res && res.ok) {
    allGroups = res.groups || [];
    groupsLoaded = true;
    editGroups.forEach((g) => {
      const m = allGroups.find((x) => String(x.id) === String(g.id));
      if (m) g.name = m.name;
    });
    renderGroupEditor();
    refreshAddSelect();
  } else {
    groupsLoaded = false;
    refreshAddSelect();
    if (!el.cfgMsg.textContent) {
      el.cfgMsg.className = 'panel-msg';
      el.cfgMsg.textContent = 'Enter the server URL + login and click "Test connection" to load your pause groups.';
    }
  }
}

async function openSettings() {
  currentCfg = await api.getConfig();
  el.cfgUrl.value = currentCfg.baseUrl || '';
  el.cfgUser.value = currentCfg.username || '';
  el.cfgPass.value = '';
  el.cfgPass.placeholder = currentCfg.hasPassword ? '(unchanged)' : 'password';
  el.cfgInsecure.checked = !!currentCfg.insecureTLS;
  el.encHint.textContent = currentCfg.encryptionAvailable
    ? 'Password is stored encrypted via the OS keychain.'
    : 'Warning: no OS keychain available — the password is stored in plain text in this app’s config folder. Use a dedicated low-privilege CEplay account.';
  el.cfgMsg.textContent = '';
  el.cfgMsg.className = 'panel-msg';

  editGroups = configuredGroups().map((g) => ({ id: g.id, name: g.name }));
  allGroups = [];
  groupsLoaded = false;
  renderGroupEditor();
  refreshAddSelect();

  el.overlay.classList.remove('hidden');
  el.cfgUrl.focus();
  loadGroupsForAdd();
}

function closeSettings() { el.overlay.classList.add('hidden'); }

el.settingsBtn.addEventListener('click', openSettings);
el.cfgCancel.addEventListener('click', closeSettings);
el.overlay.addEventListener('click', (e) => { if (e.target === el.overlay) closeSettings(); });
el.groupAddBtn.addEventListener('click', addSelectedGroup);

el.cfgSave.addEventListener('click', async () => {
  el.cfgMsg.className = 'panel-msg';
  el.cfgMsg.textContent = 'Saving…';
  await api.setConfig({
    baseUrl: el.cfgUrl.value,
    username: el.cfgUser.value,
    password: el.cfgPass.value, // blank = keep existing
    insecureTLS: el.cfgInsecure.checked,
    groups: editGroups.map((g) => ({ id: g.id, name: g.name })),
  });
  el.cfgMsg.className = 'panel-msg ok';
  el.cfgMsg.textContent = 'Saved.';
  closeSettings();
  refreshConnection();
});

el.cfgTest.addEventListener('click', async () => {
  el.cfgMsg.className = 'panel-msg';
  el.cfgMsg.textContent = 'Testing…';
  await api.setConfig({
    baseUrl: el.cfgUrl.value,
    username: el.cfgUser.value,
    password: el.cfgPass.value,
    insecureTLS: el.cfgInsecure.checked,
  });
  el.cfgPass.value = '';
  const res = await api.test();
  if (res.ok) {
    const who = res.user && (res.user.display_name || res.user.username);
    el.cfgMsg.className = 'panel-msg ok';
    el.cfgMsg.textContent = 'Connected' + (who ? ' as ' + who : '') + '. Loading groups…';
    loadGroupsForAdd();
  } else {
    el.cfgMsg.className = 'panel-msg error';
    el.cfgMsg.textContent = res.error;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !el.overlay.classList.contains('hidden')) closeSettings();
});

// --------------------------------------------------------------------------
// Boot
// --------------------------------------------------------------------------

const brandLogo = document.getElementById('brand-logo');
if (brandLogo) {
  brandLogo.addEventListener('error', () => brandLogo.classList.add('hero-logo--hidden'));
}

refreshConnection();

// --------------------------------------------------------------------------
// Demo-only: reset the simulated venue to the opening-time scenario.
// (Not present in the real Electron renderer.)
// --------------------------------------------------------------------------
const demoResetBtn = document.getElementById('demo-reset-btn');
if (demoResetBtn) {
  demoResetBtn.addEventListener('click', () => {
    if (busy || assetActionInFlight) return;
    api.__reset();
    setConn('ok');
    setStatus('Demo reset — venue back to the opening scenario (most assets paused).', 'ok');
    if (currentView === 'status') loadStatus();
  });
}
  </script>
</body>
