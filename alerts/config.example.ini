# =============================================================================
# CEplay Game Out-of-Service Slack Alerter — Configuration
# =============================================================================
# Copy this file to /etc/ceplay-alerts/config.ini and fill in the real values.
# Then run:  sudo chmod 600 /etc/ceplay-alerts/config.ini
# Both API credentials and the Slack bot token live here, so keep this file
# readable ONLY by the user the systemd service runs as.
# =============================================================================

[centeredge]
# Base URL of the CenterEdge Card System API for this location.
# Should NOT include a trailing slash. Example: https://cardsystem.example.com/api/v1
base_url = https://cardsystem.example.com/api/v1

# CenterEdge API username and password (the same ones configured in the
# CEplay "Settings" page).
username = your-api-username
password = your-api-password

# Optional X-Api-Key header. Leave blank if your CenterEdge instance does not
# require it.
api_key =


[slack]
# Slack bot token (starts with "xoxb-"). Get this from
# https://api.slack.com/apps -> your app -> "OAuth & Permissions".
# The bot must have the `chat:write` scope and be invited to the channel below.
bot_token = xoxb-your-bot-token-here

# Channel ID to post alerts in. Use the channel ID (e.g. C0123456789),
# NOT the channel name. Right-click the channel in Slack -> "View channel
# details" -> scroll to the bottom to find the channel ID.
channel = C0123456789

# Optional: text to prepend to each alert (e.g. for paging). Examples:
#   mention = <!channel>
#   mention = <!here>
#   mention = <@U0123456789>
#   mention = <!subteam^S0123456789|@tech-team>
mention =


[polling]
# How often to poll the API, in seconds. Minimum 5; default 60.
interval_seconds = 60

# Path to the JSON state file. The service user must be able to write here.
# Default location is created automatically by the systemd unit.
state_file = /var/lib/ceplay-alerts/state.json

# HTTP request timeout, in seconds.
http_timeout = 20

# Optional human-readable label for this location, included in alerts.
# Useful if you run alerters for multiple sites posting to the same channel.
location_label = Castle Fun Center
